<!DOCTYPE html>
<html lang="fa" dir="rtl">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>سازنده حرفه‌ای JSON</title>

        <!-- فونت ایرانی Vazirmatn -->
        <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

        <!-- Tabler CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css">

        <!-- Tabler Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/iconfont/tabler-icons.min.css">

        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <style>
            body {
                font-family: Vazirmatn, sans-serif;
                transition: background-color 0.3s, color 0.3s;
            }

            #output {
                background-color: var(--bs-dark-bg-subtle);
                color: var(--bs-dark-text);
            }

            .theme-switcher {
                position: fixed;
                bottom: 20px;
                right: 20px;
                z-index: 1000;
            }
        </style>
    </head>

    <body class="p-4" data-bs-theme="light">
        <!-- سوئیچ تم -->
        <div class="theme-switcher" data-bs-toggle="tooltip" title="حالت دارک مئ">
            <button class="btn btn-icon btn-outline-secondary" id="themeToggle">
                <i class="ti ti-sun"></i>
            </button>
        </div>

        <div class="container">
            <header class="text-center mb-5">
                <h1 class="display-4 fw-bold text-primary">
                    <i class="ti ti-json"></i> سازنده اسنیپت‌ حرفه‌ای
                </h1>
                <p class="lead text-muted">ابزاری قدرتمند برای تولید اسنیپت‌های JSON</p>
            </header>
            <div class="row">
                <!-- فرم ورودی -->
                <div class="col-md-6">
                    <div class="card shadow-lg mb-4">
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">عنوان اصلی:</label>
                                <input type="text" id="mainTitle" class="form-control"
                                    placeholder="مثال: Bootstrap Starter Template">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">رشته کوتا برای فراخوانی:</label>
                                <input type="text" id="subTitle" class="form-control" placeholder="مثال: bs5-starter">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">کد:</label>
                                <textarea rows="8" id="subCode" class="form-control"
                                    placeholder="کدهای خود را وارد کنید..."></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">توضیحات:</label>
                                <input type="text" id="description" class="form-control" placeholder="توضیحات مختصر...">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <!-- کنترل‌ها -->
                    <div dir="ltr" class="btn-group mb-4" role="group" aria-label="group">
                        <button id="generateBtn" title="تولید JSON" data-bs-toggle="tooltip" data-bs-placement="top"
                            class="btn btn-primary">
                            <i class="ti ti-code"></i>
                        </button>
                        <button id="copyBtn" class="btn btn-success" title="کپی JSON" data-bs-toggle="tooltip"
                            style="display: none;">
                            <i class="ti ti-copy"></i>
                        </button>
                    </div>
                    <!-- خروجی -->
                    <pre id="output" class="bg-dark text-white p-3 rounded shadow" style="display: none;"></pre>
                </div>
            </div>
            <!-- Toast برای اطلاع‌رسانی -->
            <div class="toast align-items-center text-white bg-success border-0 position-fixed bottom-0 end-0 m-3"
                role="alert" aria-live="assertive" aria-atomic="true" id="liveToast">
                <div class="d-flex">
                    <div class="toast-body">
                        محتوا با موفقیت کپی شد!
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                        aria-label="Close"></button>
                </div>
            </div>

            <!-- اسکریپت‌ها -->
            <script>
                $(document).ready(function () {
                    // مدیریت تم
                    const themeToggle = $('#themeToggle');
                    const body = $('body');

                    function updateThemeIcon(theme) {
                        themeToggle.html(theme === 'dark' ? '<i class="ti ti-moon"></i>' : '<i class="ti ti-sun"></i>');
                    }

                    themeToggle.click(function () {
                        const newTheme = body.attr('data-bs-theme') === 'dark' ? 'light' : 'dark';
                        body.attr('data-bs-theme', newTheme);
                        localStorage.setItem('theme', newTheme);
                        updateThemeIcon(newTheme);
                    });

                    // بازیابی تم ذخیره شده
                    const savedTheme = localStorage.getItem('theme') || 'light';
                    body.attr('data-bs-theme', savedTheme);
                    updateThemeIcon(savedTheme);

                    // تولید JSON
                    $('#generateBtn').click(function () {
                        const mainTitle = $('#mainTitle').val().trim();
                        const subTitle = $('#subTitle').val().trim();
                        const codeLines = $('#subCode').val().split('\n');
                        const description = $('#description').val().trim();

                        const jsonStructure = {
                            [mainTitle]: {
                                "prefix": subTitle,
                                "body": codeLines,
                                "description": description
                            }
                        };

                        const jsonString = JSON.stringify(jsonStructure, null, 4);
                        $('#output').text(jsonString).show();
                        $('#copyBtn').show();
                    });

                    // کپی محتوا با افکت
                    $('#copyBtn').click(function () {
                        const textToCopy = $('#output').text();

                        navigator.clipboard.writeText(textToCopy).then(() => {
                            const toast = new bootstrap.Toast(document.getElementById('liveToast'));
                            toast.show();
                        }).catch(err => {
                            console.error('خطا در کپی:', err);
                        });
                    });
                });
            </script>

            <!-- Bootstrap JS برای توست -->
            <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/js/tabler.min.js"></script>
    </body>

</html>
